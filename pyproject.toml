[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resolve-mcp-server"
version = "0.1.0"
description = "A local Model Context Protocol (MCP) server wrapping the DaVinci Resolve Studio Python API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Arham Jain", email = "arham837@users.noreply.github.com" }
]
keywords = ["mcp", "davinci-resolve", "video-editing", "ai-agent", "blackmagic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
resolve-mcp-server = "resolve_mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/arham837/resolve-mcp-server"
Repository = "https://github.com/arham837/resolve-mcp-server.git"
Issues = "https://github.com/arham837/resolve-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/resolve_mcp_server"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
